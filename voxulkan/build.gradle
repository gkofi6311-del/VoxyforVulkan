plugins {
    id 'fabric-loom' version '1.9.2'
    id 'java'
}

version = '0.1.0'
group = 'com.francis.voxulkan'
archivesBaseName = 'voxulkan'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.114.0+1.21.11"

    // LWJGL Vulkan bindings (bundled with Minecraft's LWJGL)
    implementation "org.lwjgl:lwjgl-vulkan:3.3.3"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
